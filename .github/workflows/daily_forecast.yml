name: Autonomous Daily Forecast & Ledger Update

on:
  schedule:
    # Her iş günü (Pazartesi-Cuma) saat 15:30 UTC (18:30 TRT - BIST seans kapanışından sonra)
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      test_email_only:
        description: "Yalnızca test e-postası gönder (piyasa taramasını atla)"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Dry run (tahminleri hesapla fakat dosyaya kaydetme)"
        type: boolean
        required: false
        default: false
      send_email:
        description: "En güçlü fırsatları e-posta bülteni olarak gönder"
        type: boolean
        required: false
        default: true
      sync_space:
        description: "Güncellenen defteri Hugging Face Space ile senkronize et"
        type: boolean
        required: false
        default: true

jobs:
  daily_forecast:
    name: Run Daily Forecast & Update Audit Ledger
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily forecasts and update audit ledger
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
        run: |
          if [ "${{ inputs.test_email_only }}" = "true" ]; then
            python -m src.daily_updater --test-email
            exit 0
          fi
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.send_email }}" = "false" ]; then
            FLAGS="$FLAGS --no-email"
          fi
          python -m src.daily_updater $FLAGS

      - name: Check for ledger changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain data/prediction_audit.json)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated prediction ledger
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prediction_audit.json
          git commit -m "chore(audit): automated daily forecast and ledger update [skip ci]"
          git push origin HEAD:main

      - name: Synchronize with Hugging Face Space
        if: ${{ steps.git_status.outputs.has_changes == 'true' && (github.event_name == 'schedule' || inputs.sync_space == true) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ℹ️ [INFO] HF_TOKEN secret tanımlanmamış, Space senkronizasyonu atlandı."
          else
            echo "🚀 Güncellenen denetim defteri Hugging Face Space'e gönderiliyor..."
            git push "https://themuhammedguler:${HF_TOKEN}@huggingface.co/spaces/themuhammedguler/BIST-Trend-Forecaster" HEAD:main --force
            echo "✅ Hugging Face Space başarıyla senkronize edildi."
          fi
