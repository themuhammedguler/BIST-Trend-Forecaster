name: Scheduled Model Retraining

on:
  schedule:
    # Her Pazartesi saat 02:00 UTC (BIST açılışından önce)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      min_accuracy:
        description: "Minimum test accuracy required to accept the model"
        required: false
        default: "0.50"
      balance_classes:
        description: "Apply scale_pos_weight to balance classes"
        type: boolean
        required: false
        default: false

jobs:
  retrain:
    name: Retrain Model & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Retrain XGBoost model with quality gate
        run: |
          MIN_ACC="${{ inputs.min_accuracy || '0.50' }}"
          EXTRA_FLAGS=""
          if [ "${{ inputs.balance_classes }}" = "true" ]; then
            EXTRA_FLAGS="--balance-classes"
          fi
          python src/model_train.py --min-accuracy "$MIN_ACC" $EXTRA_FLAGS

      - name: Run test suite to verify model invariants
        run: |
          pytest -v

      - name: Check for model or metadata changes
        id: git_diff
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain models/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request with updated model
        if: steps.git_diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(model): automated model retraining and metadata update"
          title: "chore(model): automated weekly model retraining"
          branch: "mlops/automated-model-retraining"
          delete-branch: true
          body: |
            ## Automated Model Retraining Report
            This PR was automatically generated by the weekly model retraining workflow (`.github/workflows/retrain.yml`).

            - **Quality Gate:** Test accuracy verified against the minimum threshold (`${{ inputs.min_accuracy || '0.50' }}`).
            - **Updated Files:**
              - `models/xgb_bist_model.json`
              - `models/xgb_bist_model_meta.json`
            - **Validation:** Full test suite executed and passed cleanly against the newly trained model weights.

