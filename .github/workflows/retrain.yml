name: Scheduled Model Retraining

on:
  schedule:
    # Her Cuma saat 21:00 UTC (BIST haftalık seans kapanışından sonra)
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      min_accuracy:
        description: "Minimum test accuracy required to accept the model"
        required: false
        default: "0.50"
      balance_classes:
        description: "Apply scale_pos_weight to balance classes"
        type: boolean
        required: false
        default: false
      update_data:
        description: "Fetch latest market data incrementally before retraining"
        type: boolean
        required: false
        default: true
      sync_space:
        description: "Synchronize updated weights to Hugging Face Space if HF_TOKEN is configured"
        type: boolean
        required: false
        default: true

jobs:
  retrain:
    name: Retrain Model & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Update market dataset incrementally
        if: ${{ github.event_name == 'schedule' || inputs.update_data == true }}
        run: |
          python src/data_ingestion.py --incremental --end-date today

      - name: Retrain XGBoost model with quality gate
        run: |
          MIN_ACC="${{ inputs.min_accuracy || '0.50' }}"
          EXTRA_FLAGS=""
          if [ "${{ inputs.balance_classes }}" = "true" ]; then
            EXTRA_FLAGS="--balance-classes"
          fi
          python src/model_train.py --min-accuracy "$MIN_ACC" $EXTRA_FLAGS

      - name: Check data drift and calculate PSI
        run: |
          python -m src.drift

      - name: Run test suite to verify model invariants
        run: |
          pytest -v

      - name: Check for model, data, or metadata changes
        id: git_diff
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain models/ data/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request with updated model and data
        if: steps.git_diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(mlops): automated model retraining and dataset update"
          title: "chore(mlops): automated weekly model retraining and dataset update"
          branch: "mlops/automated-model-retraining"
          delete-branch: true
          body: |
            ## Automated Model Retraining & MLOps Report
            This PR was automatically generated by the weekly model retraining workflow (`.github/workflows/retrain.yml`).

            - **Quality Gate:** Test accuracy verified against the minimum threshold (`${{ inputs.min_accuracy || '0.50' }}`).
            - **Data Drift:** Technical indicator PSI checked and validated via `src.drift`.
            - **Updated Files:**
              - `models/xgb_bist_model.json`
              - `models/xgb_bist_model_meta.json`
              - `data/bist30_combined.csv` (if new rows ingested)
            - **Validation:** Full test suite executed and passed cleanly against newly trained model weights.

      - name: Synchronize with Hugging Face Space
        if: ${{ steps.git_diff.outputs.has_changes == 'true' && (github.event_name == 'schedule' || inputs.sync_space == true) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ℹ️ [INFO] HF_TOKEN secret is not configured in repository settings. Hugging Face Space sync skipped."
            echo "To enable automated Space deployments, add HF_TOKEN under Settings -> Secrets and variables -> Actions."
          else
            echo "🚀 Pushing updated model and data to Hugging Face Space..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git push "https://themuhammedguler:${HF_TOKEN}@huggingface.co/spaces/themuhammedguler/BIST-Trend-Forecaster" HEAD:main --force
            echo "✅ Hugging Face Space successfully synchronized."
          fi
